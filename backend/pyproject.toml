[project]
name = "sitetrace-backend"
version = "0.1.0"
description = "Evidence-backed construction incident investigation pipeline"
requires-python = ">=3.11"
dependencies = [
  "aiofiles>=24.1.0",
  "boto3>=1.40.0",
  "fastapi>=0.116.0",
  "neo4j>=5.28.0",
  "openai>=2.0.0",
  "opentelemetry-api>=1.36.0",
  "opentelemetry-sdk>=1.36.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pypdf>=6.0.0",
  "python-multipart>=0.0.20",
  "reportlab>=4.4.0",
  "strands-agents[openai]>=1.50.0,<2",
  "twelvelabs>=1.3.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
